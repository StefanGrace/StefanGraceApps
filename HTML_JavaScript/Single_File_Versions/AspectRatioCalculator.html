<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Aspect Ratio Calculator</title>
        <meta name="author" content="Stefan Grace">
		<style>
			body {
				font-family: arial;
				text-align: center;
			}
            
            .label {
                text-align: right;
            }
            
			#aspect-ratio {
				padding-top: 20px;
				font-size: 20px;
			}
		</style>
	</head>
	<body>
		<h1>Aspect Ratio Calculator</h1>
		<table align="center">
			<tr>
				<td class="label">Horizontal resolution: </td>
				<td><input type="number" id="width"></input></td>
			</tr>
			<tr>
				<td class="label">Vertical resolution: </td>
				<td><input type="number" id="height"></input></td>
			</tr>
		</table>
		<div id="aspect-ratio"></div>
		<script>
            function isCleanDivison(a, b) {
                return (a / b) % 1 == 0
            }

            function isEven(a) {
                return a % 2 == 0;
            }

            function update() {
                var ar;
                var width = document.getElementById("width").value;
                var height = document.getElementById("height").value;
                
                var i = 1;
                var newX = width;
                var newY = height;
                while (i < width && i < height)
                {
                    if (isCleanDivison(width, i) && isCleanDivison(height, i))
                    {
                        newX = width / i;
                        newY = height / i;
                    }
                    i++;
                }
                if (isEven(newX) && isEven(newY))
                {
                    newX /= 2;
                    newY /= 2;
                }
                x = newX;
                y = newY;
                
                ar = x + ":" + y;
                
                if (x == 0 || y == 0) {
                    ar = "";
                }
                if (x == 8 && y == 5) {
                    ar = "16:10";
                }
                if (x == 683 && y == 384) {
                    ar = "16:9";
                    
                }
                if (x % 1 != 0 || y % 1 != 0) {
                    ar = "Must enter an integer";
                } 
                
                document.getElementById("aspect-ratio").innerHTML = ar;
            };

            update();

            setInterval(function(){update()}, 100);
        </script>
	</body>
</html>
