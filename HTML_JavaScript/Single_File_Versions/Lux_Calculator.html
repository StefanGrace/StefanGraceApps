<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Lux Calculator</title>
		<meta name="author" content="Stefan Grace">
        <style>
            body {
                font-family: arial;
                text-align: center;
            }

            input {
            }

            .label {
                text-align: right;
            }

            .user-input {
                text-align: left;
            }

            #aperture {
                width: 151px;
            }

            #shutter-unit {
                width: 80px;
            }

            #shutter-speed {
                width: 80px;
            }

            #iso {
                width: 165px;
            }

            #lux {
                padding-top: 20px;
                font-size: 20px;
            }
        </style>
	</head>
	<body>
		<h1>Lux Calculator</h1>
        
		<table align="center">
			<tr>
				<td class="label">Aperture:</td>
				<td class="user-input">f/ <input type="number" id="aperture"></input></td>
			</tr>
			<tr>
				<td class="label">Shutter speed: </td>
				<td class="user-input">
                    <select name="shutter-unit" id="shutter-unit">
                        <option value="fraction">1/</option>
                        <option value="seconds">Seconds</option>
                    </select>
                    <input type="number" id="shutter-speed"></input>
                </td>
			</tr>
			<tr>
				<td class="label">ISO: </td>
				<td class="user-input"><input type="number" id="iso"></input></td>
			</tr>
		</table>
        <button id="calculate">Calculate</button>
		<div id="lux">Lux: </div>
		<script>
            function calculateLux() {
    
                // Collect input values
                var fNumber = document.getElementById("aperture").value;
                var shutterUnit = document.getElementById("shutter-unit").value;
                var inputShutterValue = document.getElementById("shutter-speed").value;
                var iso = document.getElementById("iso").value;
                
                // Calculate shutter speed value
                var shutterSpeed;
                switch(shutterUnit){
                    case "fraction": shutterSpeed = 1 / inputShutterValue; break;
                    case "seconds": shutterSpeed = inputShutterValue; break;
                }
                
                // Calculate lux
                var ev = Math.log2((fNumber ** 2) / shutterSpeed);
                var ev100 = ev - Math.log2(iso / 100);
                var lux = 2.5 * (2 ** ev100);
                
                // Wite output to HTML page with a maximum of 4 decimal places
                document.getElementById("lux").innerHTML = "Lux: " + lux.toLocaleString(undefined, {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 4
                });
            }

            // Make it so that clicking the "Calculate" button calls the calculateLux() function
            var calculateButton = document.getElementById("calculate");
            calculateButton.addEventListener("click", calculateLux);

            // Make it so that pressing Enter calls the calculateLux() function
            document.addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    calculateLux();
                }
            });

        </script>
	</body>
</html>
